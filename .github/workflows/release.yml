name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repository checks
        run: |
          tools/check-license-headers.sh
          tools/check-strings-sync.sh
          python3 tools/check-tool-schemas.py

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BAIC2_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; skipping the release."
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.BAIC2_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baic2-release.keystore"

      - name: Build signed release
        if: steps.signing.outputs.present == 'true'
        env:
          BAIC2_KEYSTORE_PATH: ${{ runner.temp }}/baic2-release.keystore
          BAIC2_KEYSTORE_PASSWORD: ${{ secrets.BAIC2_KEYSTORE_PASSWORD }}
          BAIC2_KEY_ALIAS: ${{ secrets.BAIC2_KEY_ALIAS }}
          BAIC2_KEY_PASSWORD: ${{ secrets.BAIC2_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Create GitHub release
        if: steps.signing.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      # Release events created with GITHUB_TOKEN do not trigger other
      # workflows, so ask the site deployment to mirror the new APK.
      - name: Refresh the site mirror
        if: steps.signing.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
